<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои домохозяйства</title>
    <link rel="stylesheet" href="/pr/assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🏠 Мои домохозяйства</h1>
        <div id="household-list"></div>
        <hr>
        <h3>Создать новое</h3>
        <form id="create-form">
            <input type="text" id="household-name" placeholder="Название" required>
            <button type="submit">Создать</button>
        </form>
        <div id="error" class="error"></div>
    </div>
    <script type="module">
        import { apiRequest } from '/pr/assets/js/api-client.js';

        async function loadHouseholds() {
            const data = await apiRequest('households/');
            const list = document.getElementById('household-list');
            if (data.households.length === 0) {
                list.innerHTML = '<p>Вы не состоите ни в одном домохозяйстве</p>';
            } else {
                list.innerHTML = data.households.map(h =>
                    `<div><a href="products.html?household_id=${h.id}">${h.name}</a> (${h.role})</div>`
                ).join('');
            }
        }

        document.getElementById('create-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('household-name').value;
            try {
                await apiRequest('households/', 'POST', { name });
                document.getElementById('household-name').value = '';
                await loadHouseholds();
            } catch (err) {
                document.getElementById('error').textContent = err.message;
            }
        });

        loadHouseholds();
    </script>
</body>
</html>
